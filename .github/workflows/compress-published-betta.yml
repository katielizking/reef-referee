name: Compress published betta

on:
  push:
    paths:
      - ".github/workflows/compress-published-betta.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Resize and WebP-compress embedded textures
        run: |
          mkdir -p generated/compressed-betta
          npx --yes @gltf-transform/cli resize \
            public/models/fish/betta/betta.glb generated/compressed-betta/resized.glb \
            --width 1024 --height 1024
          npx --yes @gltf-transform/cli webp \
            generated/compressed-betta/resized.glb generated/compressed-betta/betta.glb \
            --slots "{baseColor,normalTexture,metallicRoughnessTexture}"
          test -s generated/compressed-betta/betta.glb
      - name: Publish compressed model
        run: |
          cp generated/compressed-betta/betta.glb public/models/fish/betta/betta.glb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/fish/betta/betta.glb
          if ! git diff --cached --quiet; then
            git commit -m "Compress Betta delivery textures"
            git push
          fi
