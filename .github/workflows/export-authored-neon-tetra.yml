name: Export authored neon tetra

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - assets/3d/source/neon-tetra-aeroplankton.blend
      - assets/3d/source/neon-tetra-aeroplankton.asset.json
      - tools/blender/export_authored_neon_tetra.py
      - .github/workflows/export-authored-neon-tetra.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgl1-mesa-dri
      - name: Export animated GLB and review renders
        run: |
          mkdir -p generated/neon-tetra-review
          blender --background assets/3d/source/neon-tetra-aeroplankton.blend \
            --python tools/blender/export_authored_neon_tetra.py -- \
            --output generated/neon-tetra-aeroplankton.glb \
            --review-dir generated/neon-tetra-review
          test -s generated/neon-tetra-aeroplankton.glb
          test -s generated/neon-tetra-review/side.png
          test -s generated/neon-tetra-review/three-quarter.png
          test -s generated/neon-tetra-review/top.png
          test -s generated/neon-tetra-review/export-report.json
      - name: Upload export review package
        uses: actions/upload-artifact@v4
        with:
          name: neon-tetra-authored-export
          path: |
            generated/neon-tetra-aeroplankton.glb
            generated/neon-tetra-review/
          if-no-files-found: error
          retention-days: 14
