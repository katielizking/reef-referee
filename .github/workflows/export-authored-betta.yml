name: Export authored betta

on:
  push:
    paths:
      - "assets/3d/source/betta-bluemesh/**"
      - "assets/3d/source/betta-bluemesh.asset.json"
      - "tools/blender/export_authored_betta.py"
      - ".github/workflows/export-authored-betta.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
      - name: Export production GLB
        run: |
          blender --background --python tools/blender/export_authored_betta.py -- \
            assets/3d/source/betta-bluemesh/scene.gltf \
            generated/betta/betta.glb
          test -s generated/betta/betta.glb
          test -s generated/betta/betta.json
      - name: Publish production model
        run: |
          mkdir -p public/models/fish/betta
          cp generated/betta/betta.glb public/models/fish/betta/betta.glb
          cat > public/models/fish/betta/ATTRIBUTION.md <<'EOF'
          # Betta splendens model

          - Creator: [BlueMesh](https://sketchfab.com/VapTor)
          - Source: [Betta Splendens](https://sketchfab.com/3d-models/betta-splendens-f4eeb7f50ad24873842bd954ad27d23b)
          - Licence: [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)
          - Changes: staging geometry removed; model reoriented to +X and scaled to a 6 cm total-length reference; original skin, animation and PBR textures retained.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/fish/betta/
          if ! git diff --cached --quiet; then
            git commit -m "Publish authored Betta production model"
            git push
          fi

      - name: Upload production package
        uses: actions/upload-artifact@v4
        with:
          name: authored-betta-production
          path: generated/betta/
          if-no-files-found: error
          retention-days: 14
