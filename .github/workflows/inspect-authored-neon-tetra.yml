name: Inspect authored neon tetra

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - assets/3d/source/neon-tetra-aeroplankton.blend
      - assets/3d/source/neon-tetra-aeroplankton.asset.json
      - tools/blender/inspect_authored_blend.py
      - .github/workflows/inspect-authored-neon-tetra.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgl1-mesa-dri
      - name: Inspect source and render preview
        run: |
          blender --background assets/3d/source/neon-tetra-aeroplankton.blend \
            --python tools/blender/inspect_authored_blend.py -- generated/authored-neon-review
          test -s generated/authored-neon-review/inspection.json
          test -s generated/authored-neon-review/studio-preview.png
      - name: Upload inspection package
        uses: actions/upload-artifact@v4
        with:
          name: authored-neon-tetra-inspection
          path: generated/authored-neon-review/
          if-no-files-found: error
          retention-days: 14
